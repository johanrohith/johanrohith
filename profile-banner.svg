<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Johan Rohith — building at the edge of the known</title>
  <desc id="desc">A quiet, dark cosmic scene with a distant ringed planet, subtle terminal typography, and a tiny glowing horizon.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b12"/>
      <stop offset=".55" stop-color="#17101d"/>
      <stop offset="1" stop-color="#090b12"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#a66b8d" stop-opacity=".35"/>
      <stop offset="1" stop-color="#a66b8d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9b6c8"/>
      <stop offset=".45" stop-color="#78536f"/>
      <stop offset="1" stop-color="#241b32"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8b8cc" stop-opacity="0"/>
      <stop offset=".3" stop-color="#d8b8cc" stop-opacity=".8"/>
      <stop offset=".72" stop-color="#a17eaa" stop-opacity=".8"/>
      <stop offset="1" stop-color="#d8b8cc" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <circle cx="900" cy="170" r="235" fill="url(#glow)"/>
  <g fill="#f0e7f0">
    <circle cx="89" cy="57" r="1.2" opacity=".65"/><circle cx="176" cy="123" r="1" opacity=".55"/>
    <circle cx="271" cy="42" r="1.4" opacity=".7"/><circle cx="355" cy="87" r=".8" opacity=".6"/>
    <circle cx="459" cy="35" r="1" opacity=".5"/><circle cx="524" cy="137" r="1.3" opacity=".7"/>
    <circle cx="647" cy="62" r=".9" opacity=".6"/><circle cx="742" cy="32" r="1.3" opacity=".55"/>
    <circle cx="1077" cy="52" r="1" opacity=".65"/><circle cx="1122" cy="128" r="1.2" opacity=".6"/>
    <circle cx="1017" cy="298" r=".9" opacity=".6"/><circle cx="823" cy="315" r="1" opacity=".5"/>
    <circle cx="631" cy="279" r="1.2" opacity=".55"/><circle cx="392" cy="305" r=".8" opacity=".5"/>
    <circle cx="183" cy="278" r="1.2" opacity=".6"/>
  </g>
  <g transform="translate(895 169)">
    <ellipse rx="145" ry="35" fill="none" stroke="url(#ring)" stroke-width="13" transform="rotate(-18)"/>
    <circle r="67" fill="url(#planet)"/>
    <path d="M-56 -26 Q0 -58 53 -23" fill="none" stroke="#e7ccdb" stroke-opacity=".25" stroke-width="2"/>
    <path d="M-63 13 Q0 37 62 6" fill="none" stroke="#17101d" stroke-opacity=".55" stroke-width="9"/>
    <ellipse rx="145" ry="35" fill="none" stroke="url(#ring)" stroke-width="2" transform="rotate(-18)"/>
  </g>
  <path d="M0 294 Q230 277 414 300 T800 291 T1200 298" fill="none" stroke="#76506d" stroke-opacity=".35"/>
  <path d="M0 312 Q250 300 485 316 T900 308 T1200 316" fill="none" stroke="#76506d" stroke-opacity=".2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="68" y="76" font-size="12" letter-spacing="3" fill="#c59bb6">FIELD NOTES / 001</text>
    <text x="65" y="164" font-size="48" font-weight="600" letter-spacing="-2" fill="#f2eaf1">Johan Rohith</text>
    <text x="69" y="198" font-size="16" letter-spacing="1.5" fill="#c6b2c8">building at the edge of the known</text>
    <text x="69" y="251" font-size="12" fill="#9d829f">$ build · explore · create</text>
    <path d="M69 269 H255" stroke="#a66b8d" stroke-width="1"/>
    <circle cx="262" cy="269" r="2" fill="#d8b8cc"/>
  </g>
  <rect x="1" y="1" width="1198" height="358" rx="17" fill="none" stroke="#8e6687" stroke-opacity=".25"/>
</svg>
