<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="875" viewBox="0 0 1000 875" role="img" aria-labelledby="title desc">
<title id="title">Johan Rohith — Astra terminal</title>
<desc id="desc">The terminal starts blank. Each command and response types in order, stays visible, and a green cursor starts blinking after Process Complete.</desc>
<style>
  .bg { fill: #0d1117; }
  .frame { fill: none; stroke: #30363d; stroke-width: 1.5; }
  .divider { stroke: #30363d; stroke-width: 1; }
  .green { fill: #3fb950; }
  .white { fill: #f0f6fc; }
  .muted { fill: #8b949e; }
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 21px; }
  .cmd { font-weight: 600; }
  /* Critical: start hidden during each line's delay; keep revealed text afterwards. */
  .typed { clip-path: inset(0 100% 0 0); }
  @keyframes typing { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  .cursor {
    fill: #3fb950;
    opacity: 0;
    animation: cursor-appear .1s linear 12.588s forwards, cursor-blink 1s steps(2, start) 12.688s infinite;
  }
  @keyframes cursor-appear { to { opacity: 1; } }
  @keyframes cursor-blink { to { visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) {
    .typed { animation: none !important; clip-path: none !important; }
    .cursor { opacity: 1; animation: none; }
  }
</style>
<rect class="bg" width="1000" height="875" rx="14"/>
<rect class="frame" x="1" y="1" width="998" height="873" rx="13"/>
<path class="bg" d="M14 1H986Q999 1 999 14V56H1V14Q1 1 14 1Z"/>
<path class="divider" d="M1 56H999"/>
<circle cx="25" cy="28" r="5" fill="#28C840"/>
<circle cx="44" cy="28" r="5" fill="#FEBC2E"/>
<circle cx="63" cy="28" r="5" fill="#FF5F57"/>
<text x="500" y="34" class="white" text-anchor="middle" font-size="17" font-weight="600">Terminal</text>
<text x="974" y="32" class="muted" text-anchor="end" font-size="13">ASTRA</text>

<text x="28" y="90" class="green cmd typed" font-size="21" style="animation: typing 0.324s steps(27, end) 0.300s both;">johanrohith@astra:~$ whoami</text>
<text x="28" y="120" class="white typed" font-size="21" style="animation: typing 0.220s steps(12, end) 0.784s both;">Johan Rohith</text>

<text x="28" y="170" class="green cmd typed" font-size="21" style="animation: typing 0.408s steps(34, end) 1.164s both;">johanrohith@astra:~$ cat about.txt</text>
<text x="28" y="200" class="white typed" font-size="21" style="animation: typing 0.636s steps(53, end) 1.732s both;">I explore ideas, build things and create beyond code.</text>
<text x="28" y="228" class="white typed" font-size="21" style="animation: typing 0.456s steps(38, end) 2.528s both;">From web projects to creative stories,</text>
<text x="28" y="256" class="white typed" font-size="21" style="animation: typing 0.588s steps(49, end) 3.144s both;">I'm always curious about what my idea can become.</text>

<text x="28" y="306" class="green cmd typed" font-size="21" style="animation: typing 0.900s steps(75, end) 3.892s both;">johanrohith@astra:~$ curl -s ipinfo.io | jq '{ip, city, country, timezone}'</text>
<text x="28" y="334" class="white typed" font-size="21" style="animation: typing 0.220s linear 4.952s both;">{</text>
<text x="28" y="364" class="white typed" font-size="21" style="animation: typing 0.312s steps(26, end) 5.332s both;">  "ip":       "127.0.0.1",</text>
<text x="28" y="392" class="white typed" font-size="21" style="animation: typing 0.288s steps(24, end) 5.804s both;">  "city":     "Chennai",</text>
<text x="28" y="420" class="white typed" font-size="21" style="animation: typing 0.228s steps(19, end) 6.252s both;">  "country":  "IN",</text>
<text x="28" y="448" class="white typed" font-size="21" style="animation: typing 0.336s steps(28, end) 6.640s both;">  "timezone": "Asia/Kolkata"</text>
<text x="28" y="470" class="white typed" font-size="21" style="animation: typing 0.220s linear 7.136s both;">}</text>

<text x="28" y="526" class="green cmd typed" font-size="21" style="animation: typing 0.408s steps(34, end) 7.516s both;">johanrohith@astra:~$ ls interests/</text>
<text x="28" y="556" class="white typed" font-size="21" style="animation: typing 0.220s steps(17, end) 8.084s both;">creative-writing/</text>
<text x="28" y="584" class="white typed" font-size="21" style="animation: typing 0.220s steps(16, end) 8.464s both;">web-development/</text>

<text x="28" y="634" class="green cmd typed" font-size="21" style="animation: typing 0.672s steps(56, end) 8.844s both;">johanrohith@astra:~$ cat ~/interests/web-development.txt</text>
<text x="28" y="664" class="white typed" font-size="21" style="animation: typing 0.456s steps(38, end) 9.676s both;">[STACK] HTML · CSS · JavaScript · Java</text>

<text x="28" y="714" class="green cmd typed" font-size="21" style="animation: typing 0.384s steps(32, end) 10.292s both;">johanrohith@astra:~$ echo $FOCUS</text>
<text x="28" y="744" class="white typed" font-size="21" style="animation: typing 0.220s steps(18, end) 10.836s both;">Learn by building.</text>
<text x="28" y="772" class="white typed" font-size="21" style="animation: typing 0.252s steps(21, end) 11.216s both;">Improve by exploring.</text>

<text x="28" y="822" class="green cmd typed" font-size="21" style="animation: typing 0.300s steps(25, end) 11.628s both;">johanrohith@astra:~$ exit</text>
<text x="28" y="852" class="muted typed" font-size="20" style="animation: typing 0.220s steps(18, end) 12.088s both;">[Process Complete]</text>
<rect class="cursor" x="254" y="835" width="11" height="21" rx="1"/>
</svg>
