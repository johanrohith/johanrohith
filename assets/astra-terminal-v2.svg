<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="835" viewBox="0 0 1000 835" role="img" aria-labelledby="title desc">
<title id="title">Johan Rohith — Astra terminal</title>
<desc id="desc">Larger terminal text types once, stays visible, and then the final cursor blinks.</desc>
<style>
  .bg { fill:#0d1117; }
  .frame { fill:none; stroke:#30363d; stroke-width:1.5; }
  .divider { stroke:#30363d; stroke-width:1; }
  .green { fill:#3fb950; }
  .white { fill:#f0f6fc; }
  .muted { fill:#8b949e; }
  text { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace; font-size:20px; }
  .cmd { font-weight:600; }
  /* Default state is readable if animation is unsupported. */
  .typed { clip-path:inset(0 0 0 0); }
  @keyframes typing { from { clip-path:inset(0 100% 0 0); } to { clip-path:inset(0 0 0 0); } }
  .cursor {
    fill:#3fb950;
    opacity:0;
    animation:appear .1s linear 7.690s forwards, blink 1s steps(2,start) 7.790s infinite;
  }
  @keyframes appear { to { opacity:1; } }
  @keyframes blink { to { visibility:hidden; } }
  @media (prefers-reduced-motion:reduce) {
    .typed { animation:none !important; clip-path:none !important; }
    .cursor { opacity:1; animation:none; }
  }
</style>
<rect class="bg" width="1000" height="835" rx="14"/>
<rect class="frame" x="1" y="1" width="998" height="833" rx="13"/>
<path class="bg" d="M14 1H986Q999 1 999 14V54H1V14Q1 1 14 1Z"/>
<path class="divider" d="M1 54H999"/>
<circle cx="24" cy="27" r="5" fill="#8b949e"/><circle cx="43" cy="27" r="5" fill="#8b949e"/><circle cx="62" cy="27" r="5" fill="#3fb950"/>
<text x="500" y="33" class="white" text-anchor="middle" font-size="16" font-weight="600">Terminal</text>
<text x="974" y="31" class="muted" text-anchor="end" font-size="12">ASTRA // SESSION 001</text>
<text x="26" y="88" class="green cmd typed" font-size="19" style="animation: typing 0.216s steps(27, end) 0.220s forwards;">johanrohith@astra:~$ whoami</text><text x="26" y="116" class="white typed" font-size="19" style="animation: typing 0.160s steps(12, end) 0.506s forwards;">Johan Rohith</text><text x="26" y="164" class="green cmd typed" font-size="19" style="animation: typing 0.272s steps(34, end) 0.736s forwards;">johanrohith@astra:~$ cat about.txt</text><text x="26" y="192" class="white typed" font-size="19" style="animation: typing 0.424s steps(53, end) 1.078s forwards;">I explore ideas, build things and create beyond code.</text><text x="26" y="218" class="white typed" font-size="19" style="animation: typing 0.304s steps(38, end) 1.572s forwards;">From web projects to creative stories,</text><text x="26" y="244" class="white typed" font-size="19" style="animation: typing 0.392s steps(49, end) 1.946s forwards;">I'm always curious about what my idea can become.</text><text x="26" y="292" class="green cmd typed" font-size="19" style="animation: typing 0.600s steps(75, end) 2.408s forwards;">johanrohith@astra:~$ curl -s ipinfo.io | jq '{ip, city, country, timezone}'</text><text x="26" y="320" class="white typed" font-size="19" style="animation: typing 0.160s steps(1, end) 3.078s forwards;">{</text><text x="26" y="346" class="white typed" font-size="19" style="animation: typing 0.208s steps(26, end) 3.308s forwards;">  "ip":       "127.0.0.1",</text><text x="26" y="372" class="white typed" font-size="19" style="animation: typing 0.192s steps(24, end) 3.586s forwards;">  "city":     "Chennai",</text><text x="26" y="398" class="white typed" font-size="19" style="animation: typing 0.160s steps(19, end) 3.848s forwards;">  "country":  "IN",</text><text x="26" y="424" class="white typed" font-size="19" style="animation: typing 0.224s steps(28, end) 4.078s forwards;">  "timezone": "Asia/Kolkata"</text><text x="26" y="450" class="white typed" font-size="19" style="animation: typing 0.160s steps(1, end) 4.372s forwards;">}</text><text x="26" y="498" class="green cmd typed" font-size="19" style="animation: typing 0.272s steps(34, end) 4.602s forwards;">johanrohith@astra:~$ ls interests/</text><text x="26" y="526" class="white typed" font-size="19" style="animation: typing 0.160s steps(17, end) 4.944s forwards;">creative-writing/</text><text x="26" y="552" class="white typed" font-size="19" style="animation: typing 0.160s steps(16, end) 5.174s forwards;">web-development/</text><text x="26" y="600" class="green cmd typed" font-size="19" style="animation: typing 0.448s steps(56, end) 5.404s forwards;">johanrohith@astra:~$ cat ~/interests/web-development.txt</text><text x="26" y="628" class="white typed" font-size="19" style="animation: typing 0.304s steps(38, end) 5.922s forwards;">[STACK] HTML · CSS · JavaScript · Java</text><text x="26" y="676" class="green cmd typed" font-size="19" style="animation: typing 0.256s steps(32, end) 6.296s forwards;">johanrohith@astra:~$ echo $FOCUS</text><text x="26" y="704" class="white typed" font-size="19" style="animation: typing 0.160s steps(18, end) 6.622s forwards;">Learn by building.</text><text x="26" y="730" class="white typed" font-size="19" style="animation: typing 0.168s steps(21, end) 6.852s forwards;">Improve by exploring.</text><text x="26" y="778" class="green cmd typed" font-size="19" style="animation: typing 0.200s steps(25, end) 7.090s forwards;">johanrohith@astra:~$ exit</text><text x="26" y="806" class="muted typed" font-size="18" style="animation: typing 0.160s steps(19, end) 7.360s forwards;">[Process completed]</text>
<rect class="cursor" x="236.2" y="793" width="11" height="19" rx="1"/>
</svg>