<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
  <title id="title">Johan Rohith — Astra terminal</title>
  <desc id="desc">A compact, static terminal introduction. Only the final cursor blinks.</desc>
  <style>
    .bg { fill: #0d1117; }
    .frame { fill: none; stroke: #30363d; stroke-width: 1.5; }
    .divider { stroke: #30363d; stroke-width: 1; }
    .green { fill: #3fb950; }
    .white { fill: #f0f6fc; }
    .muted { fill: #8b949e; }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; }
    .small { font-size: 10px; }
    .cmd { font-weight: 600; }
    .cursor { fill: #3fb950; animation: blink 1s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
  <rect class="bg" width="1000" height="450" rx="13"/>
  <rect class="frame" x="1" y="1" width="998" height="448" rx="12"/>
  <path class="bg" d="M13 1 H987 Q999 1 999 13 V42 H1 V13 Q1 1 13 1Z"/>
  <path class="divider" d="M1 42 H999"/>
  <circle cx="23" cy="21" r="4.5" fill="#8b949e"/>
  <circle cx="40" cy="21" r="4.5" fill="#8b949e"/>
  <circle cx="57" cy="21" r="4.5" fill="#3fb950"/>
  <text x="500" y="26" class="white" text-anchor="middle" font-size="12" font-weight="600">Terminal</text>
  <text x="970" y="25" class="muted small" text-anchor="end">ASTRA // SESSION 001</text>

  <text x="24" y="64" class="green cmd">johanrohith@astra:~$ whoami</text>
  <text x="24" y="80" class="white">Johan Rohith</text>

  <text x="24" y="101" class="green cmd">johanrohith@astra:~$ cat about.txt</text>
  <text x="24" y="117" class="white">I explore ideas, build things and create beyond code.</text>
  <text x="24" y="132" class="white">From web projects to creative stories,</text>
  <text x="24" y="147" class="white">I'm always curious about what my idea can become.</text>

  <text x="24" y="168" class="green cmd">johanrohith@astra:~$ curl -s ipinfo.io | jq '{ip, city, country, timezone}'</text>
  <text x="24" y="184" class="white">{</text>
  <text x="44" y="199" class="white">"ip":       "127.0.0.1",</text>
  <text x="44" y="214" class="white">"city":     "Chennai",</text>
  <text x="44" y="229" class="white">"country":  "IN",</text>
  <text x="44" y="244" class="white">"timezone": "Asia/Kolkata"</text>
  <text x="24" y="259" class="white">}</text>

  <text x="24" y="280" class="green cmd">johanrohith@astra:~$ ls interests/</text>
  <text x="24" y="296" class="white">creative-writing/</text>
  <text x="24" y="311" class="white">web-development/</text>

  <text x="24" y="332" class="green cmd">johanrohith@astra:~$ cat ~/interests/web-development.txt</text>
  <text x="24" y="348" class="white">[STACK] HTML · CSS · JavaScript · Java</text>

  <text x="24" y="369" class="green cmd">johanrohith@astra:~$ echo $FOCUS</text>
  <text x="24" y="385" class="white">Learn by building.</text>
  <text x="24" y="400" class="white">Improve by exploring.</text>

  <text x="24" y="421" class="green cmd">johanrohith@astra:~$ exit</text>
  <text x="24" y="437" class="muted">[Process completed]</text>
  <rect class="cursor" x="179" y="426" width="7" height="13" rx="1"/>
</svg>
